name: code-station-launcher-demo
services:
  code-server:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    image: code-station-window-demo:local
    ports:
      - "127.0.0.1:18880:8080"
    volumes:
      - ./workspace:/home/coder/project
      - opencode-data:/home/coder/.local/share/opencode
      - opencode-config:/home/coder/.config/opencode
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  opencode-data:
  opencode-config:
